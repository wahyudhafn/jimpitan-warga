
name: Supabase Keep Alive

on:
  schedule:
    # Setiap hari pukul 03.00 WIB (20.00 UTC hari sebelumnya)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets belum diatur."
            exit 1
          fi

          HTTP_CODE=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/collection_periods?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Permintaan Supabase gagal."
            exit 1
          fi

          echo "Supabase berhasil diakses."
